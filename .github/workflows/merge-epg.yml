name: Merge EPG Smart

on:
  push:
    paths:
      - 'update.json'  # Triggers ONLY when update.json is modified and pushed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Merge EPG Files
        run: |
          cat > merge_epg.py << 'PYTHON_EOF'
          import os
          import re
          import glob
          import gzip
          import urllib.request
          from datetime import datetime, timedelta, timezone

          def unescape_xml(text):
              if not text: return ""
              return text.replace('&lt;', '<').replace('&gt;', '>').replace('&amp;', '&').replace('&apos;', "'").replace('&quot;', '"')

          def parse_epg_content(content):
              channels = {}
              programmes = []
              
              # ULTRA-SAFE SPLIT METHOD FOR CHANNELS (Preserves exact XML formation without breaking nested tags)
              channel_blocks = content.split('</channel>')
              for block in channel_blocks[:-1]:
                  start_idx = block.find('<channel ')
                  if start_idx != -1:
                      full_block = block[start_idx:] + '</channel>'
                      id_match = re.search(r'<channel[^>]+id="([^"]+)"', full_block)
                      if id_match:
                          channels[id_match.group(1)] = full_block.strip()
              
              # ULTRA-SAFE SPLIT METHOD FOR PROGRAMMES
              prog_blocks = content.split('</programme>')
              for block in prog_blocks[:-1]:
                  start_idx = block.find('<programme ')
                  if start_idx != -1:
                      full_block = block[start_idx:] + '</programme>'
                      channel_match = re.search(r'channel="([^"]+)"', full_block)
                      start_match = re.search(r'start="([^"]+)"', full_block)
                      if channel_match:
                          programmes.append({
                              'channel': channel_match.group(1),
                              'xml': full_block.strip(),
                              'start': start_match.group(1) if start_match else ''
                          })
              
              return channels, programmes

          def write_compressed_file(xml_content, output_path):
              xml_bytes = xml_content.encode('utf-8')
              compressed_data = gzip.compress(xml_bytes, compresslevel=9, mtime=0)
              
              with open(output_path, 'wb') as f:
                  f.write(compressed_data)

          def build_xml(channels, programmes):
              # CRITICAL: Sort programmes by channel so they are grouped sequentially!
              programmes.sort(key=lambda x: (x['channel'], x['start']))
              
              # Sort channels alphabetically to match programme blocks
              sorted_channel_ids = sorted(channels.keys())
              
              # Standard XMLTV Header
              xml_parts = [
                  '<?xml version="1.0" encoding="UTF-8"?>',
                  '<tv generator-info-name="SmartEPG">'
              ]
              
              # Inject Channel blocks exactly as they were formatted
              for ch_id in sorted_channel_ids:
                  xml_parts.append(channels[ch_id])
              
              # Inject Programme blocks exactly as they were formatted
              for prog in programmes:
                  xml_parts.append(prog['xml'])
              
              xml_parts.append('</tv>\n')
              
              return '\n'.join(xml_parts)

          def main():
              print("=" * 70)
              print("EPG SMART MERGER - CATCHUP & LIVE (IST TIMEZONE)")
              print("=" * 70)
              
              # Set Indian Standard Time (IST) timezone
              ist_tz = timezone(timedelta(hours=5, minutes=30))
              today = datetime.now(ist_tz).date()
              
              # Determine target dates
              tomorrow = today + timedelta(days=1)
              live_dates = {today.strftime('%Y-%m-%d'), tomorrow.strftime('%Y-%m-%d')}
              
              # Past 7 days (today-1 down to today-7)
              catchup_dates = {(today - timedelta(days=i)).strftime('%Y-%m-%d') for i in range(1, 8)}
              
              # 10 Days Cutoff for Cleanup
              cutoff_date = today - timedelta(days=10)
              
              full_channels = {}
              full_programmes_dict = {} 
              live_channels = {}
              live_programmes_dict = {} 
              
              # Search for XMLs in Epg directory and Root directory
              all_xml_files = glob.glob("Epg/*.xml") + glob.glob("*.xml")
              
              for file_path in set(all_xml_files):  # Use set to avoid duplicates
                  filename = os.path.basename(file_path)
                  if filename in ['Epg.xml', 'LiveEpg.xml']:
                      continue
                      
                  # Extract date from filename (assumes YYYY-MM-DD pattern)
                  match = re.search(r'(\d{4}-\d{2}-\d{2})', filename)
                  if not match:
                      continue
                      
                  file_date_str = match.group(1)
                  try:
                      file_date = datetime.strptime(file_date_str, '%Y-%m-%d').date()
                  except ValueError:
                      continue
                      
                  # 1. Cleanup old files
                  if file_date < cutoff_date:
                      try:
                          os.remove(file_path)
                          print(f"🗑️ Deleted old file (>10 days): {file_path}")
                      except Exception as e:
                          print(f"  ✗ Error deleting {file_path}: {e}")
                      continue
                      
                  # 2. Process active files
                  is_live = file_date_str in live_dates
                  is_catchup = file_date_str in catchup_dates
                  
                  if is_live or is_catchup:
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              content = f.read()
                          
                          channels, programmes = parse_epg_content(content)
                          tag = "🔴 LIVE" if is_live else "⏪ CATCHUP"
                          print(f"  📅 {file_date_str} [{tag}]: {filename} ({len(programmes)} programmes)")
                          
                          for ch_id, ch_xml in channels.items():
                              # PURGE OLD FRAGMENTED SAMSUNG CHANNELS (JioTV IDs are purely numeric)
                              if not ch_id.isdigit():
                                  continue 
                              full_channels[ch_id] = ch_xml
                              if is_live:
                                  live_channels[ch_id] = ch_xml
                          
                          for prog in programmes:
                              # PURGE OLD FRAGMENTED SAMSUNG PROGRAMMES
                              if not prog['channel'].isdigit():
                                  continue
                              prog_key = (prog['channel'], prog['start'])
                              full_programmes_dict[prog_key] = prog
                              if is_live:
                                  live_programmes_dict[prog_key] = prog
                                  
                      except Exception as e:
                          print(f"    ✗ Error reading {file_path}: {e}")
              
              # ==========================================
              # 🔄 SAMSUNG TV PLUS EPG MERGE (FRESH DOWNLOAD)
              # ==========================================
              print("\n🌐 Fetching Samsung TV Plus EPG...")
              try:
                  req = urllib.request.Request(
                      'https://raw.githubusercontent.com/matthuisman/i.mjh.nz/refs/heads/master/SamsungTVPlus/in.xml',
                      headers={'User-Agent': 'Mozilla/5.0'}
                  )
                  with urllib.request.urlopen(req) as response:
                      samsung_content = response.read().decode('utf-8')
                      sam_channels, sam_programmes = parse_epg_content(samsung_content)
                      
                      existing_names = set()
                      name_pattern = r'<display-name[^>]*>(.*?)</display-name>'
                      
                      # Build Set of existing names to avoid duplicates
                      for ch_xml in full_channels.values():
                          match = re.search(name_pattern, ch_xml)
                          if match:
                              existing_names.add(unescape_xml(match.group(1).strip()))
                      
                      skipped_sam_ids = set()
                      added_sam_channels = 0
                      
                      # Safely extract and filter channels
                      for ch_id, ch_xml in sam_channels.items():
                          match = re.search(name_pattern, ch_xml)
                          name = unescape_xml(match.group(1).strip()) if match else ""
                          
                          if name in existing_names or ch_id in full_channels:
                              skipped_sam_ids.add(ch_id)
                          else:
                              full_channels[ch_id] = ch_xml
                              live_channels[ch_id] = ch_xml
                              added_sam_channels += 1
                      
                      added_sam_progs = 0
                      valid_full_dates = catchup_dates.union(live_dates)
                      
                      # Safely extract and correctly assign programmes by exact dates
                      for prog in sam_programmes:
                          if prog['channel'] not in skipped_sam_ids:
                              prog_key = (prog['channel'], prog['start'])
                              
                              prog_start = prog['start']
                              if len(prog_start) >= 8:
                                  prog_date_str = f"{prog_start[0:4]}-{prog_start[4:6]}-{prog_start[6:8]}"
                                  
                                  if prog_date_str in valid_full_dates:
                                      full_programmes_dict[prog_key] = prog
                                      added_sam_progs += 1
                                  
                                  # Only put in Live EPG if the date matches today/tomorrow!
                                  if prog_date_str in live_dates:
                                      live_programmes_dict[prog_key] = prog
                              else:
                                  full_programmes_dict[prog_key] = prog
                                  live_programmes_dict[prog_key] = prog
                                  added_sam_progs += 1
                      
                      print(f"  ✅ Merged Samsung EPG: Added {added_sam_channels} unique channels & {added_sam_progs} programmes.")
              except Exception as e:
                  print(f"  ⚠️ Failed to merge Samsung EPG: {e}")

              # Build and write final outputs
              full_programmes = list(full_programmes_dict.values())
              live_programmes = list(live_programmes_dict.values())

              if full_programmes:
                  print(f"\n📦 Building Full EPG ({len(full_programmes)} total programmes)...")
                  build_xml_content = build_xml(full_channels, full_programmes)
                  write_compressed_file(build_xml_content, 'Epg.xml.gz')
              
              if live_programmes:
                  print(f"📦 Building Live EPG ({len(live_programmes)} live programmes)...")
                  build_xml_content = build_xml(live_channels, live_programmes)
                  write_compressed_file(build_xml_content, 'LiveEpg.xml.gz')
              
              print("✅ Process Completed Successfully!")

          if __name__ == "__main__":
              main()
          PYTHON_EOF
          
          python3 merge_epg.py

      - name: Commit and Push
        run: |
          rm -f merge_epg.py Epg.xml LiveEpg.xml
          
          if [ -f Epg.xml.gz ] && [ -f LiveEpg.xml.gz ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add Epg.xml.gz LiveEpg.xml.gz
            git add -u  # CRITICAL: This stages the old .xml files deleted by the script
            
            if git diff --cached --quiet; then
              echo "ℹ️ No changes to commit"
            else
              git commit -m "Auto update EPG & cleanup: $(date +%Y-%m-%d_%H-%M) [skip ci]"
              git push
              echo "✓ Successfully pushed!"
            fi
          else
            echo "❌ ERROR: Output files were not created!"
            exit 1
          fi
