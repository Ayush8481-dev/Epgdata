name: Merge EPG Smart

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  push:
    paths:
      - 'Epg/*.xml'
      - '*hannels.txt'  # Triggers on channels.txt OR Channels.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Merge EPG Files
        run: |
          cat > merge_epg.py << 'PYTHON_EOF'
          import os
          import sys
          import re
          import glob
          import gzip
          from datetime import datetime, timedelta
          from collections import OrderedDict

          def read_channel_ids():
              """Bulletproof reader for channels.txt or Channels.txt"""
              channel_ids = []
              
              # Check for both lowercase and uppercase variations (Linux is case-sensitive)
              file_path = None
              if os.path.exists('channels.txt'):
                  file_path = 'channels.txt'
              elif os.path.exists('Channels.txt'):
                  file_path = 'Channels.txt'
                  
              if file_path:
                  print(f"  ✓ Found file: {file_path}")
                  with open(file_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  # Highly aggressive extraction: 
                  # Grabs anything inside double quotes, ignoring brackets and missing commas
                  extracted_ids = re.findall(r'"([^"]+)"', content)
                  
                  if extracted_ids:
                      channel_ids = extracted_ids
                  else:
                      # Fallback: Just read line by line, stripping brackets and quotes
                      for line in content.splitlines():
                          clean_line = re.sub(r'[\[\]",]', '', line).strip()
                          if clean_line:
                              channel_ids.append(clean_line)
              else:
                  print("  ⚠️ Could not find channels.txt or Channels.txt in the repository!")

              # Clean whitespace
              cleaned_ids = [c.strip() for c in channel_ids if c.strip()]
              
              if not cleaned_ids:
                  print("  ⚠️ No channels parsed. Falling back to defaults.")
                  cleaned_ids = ["951", "952", "953"]
              
              return cleaned_ids

          def parse_epg_content(content):
              channels = OrderedDict()
              programmes = []
              
              channel_pattern = r'<channel id="([^"]+)"[^>]*>(.*?)</channel>'
              for match in re.finditer(channel_pattern, content, re.DOTALL):
                  channel_id = match.group(1)
                  channel_xml = match.group(0)
                  if channel_id not in channels:
                      channels[channel_id] = channel_xml
              
              programme_pattern = r'<programme[^>]*>(.*?)</programme>'
              for match in re.finditer(programme_pattern, content, re.DOTALL):
                  prog_xml = match.group(0)
                  channel_match = re.search(r'channel="([^"]+)"', prog_xml)
                  if channel_match:
                      start_match = re.search(r'start="([^"]+)"', prog_xml)
                      programmes.append({
                          'channel': channel_match.group(1),
                          'xml': prog_xml,
                          'start': start_match.group(1) if start_match else ''
                      })
              
              return channels, programmes

          def optimize_xml_size(xml_content):
              xml_content = re.sub(r'>\s+<', '><', xml_content)
              xml_content = re.sub(r'>\s+', '>', xml_content)
              xml_content = re.sub(r'\s+<', '<', xml_content)
              xml_content = re.sub(r'\n\s*\n', '\n', xml_content)
              xml_content = re.sub(r'\s+', ' ', xml_content)
              return xml_content

          def write_compressed_file(xml_content, output_path):
              optimized_xml = optimize_xml_size(xml_content)
              xml_bytes = optimized_xml.encode('utf-8')
              compressed_data = gzip.compress(xml_bytes, compresslevel=9, mtime=0)
              
              with open(output_path, 'wb') as f:
                  f.write(compressed_data)
              
              return {
                  'original_size': len(xml_bytes),
                  'compressed_size': len(compressed_data)
              }

          def build_xml(channels, programmes):
              programmes.sort(key=lambda x: x['start'])
              xml_parts = ['<?xml version="1.0" encoding="UTF-8"?>\n<tv>']
              
              for ch_xml in channels.values():
                  xml_parts.append(re.sub(r'\s+', ' ', ch_xml.strip()))
              
              for prog in programmes:
                  xml_parts.append(re.sub(r'\s+', ' ', prog['xml'].strip()))
              
              xml_parts.append('</tv>')
              return '\n'.join(xml_parts)

          def main():
              print("=" * 70)
              print("EPG SMART MERGER - 9 DAYS CATCHUP (DEBUG MODE)")
              print("=" * 70)
              
              channel_ids = read_channel_ids()
              print(f"\n✓ Loaded {len(channel_ids)} catchup channels. Here is what was read:")
              print(f"  {channel_ids}")
              
              # Strictly 9 days back
              today = datetime.now().date()
              back_dates = [(today - timedelta(days=i)).strftime('%Y-%m-%d') for i in range(9, 0, -1)]
              today_str = today.strftime('%Y-%m-%d')
              tomorrow_str = (today + timedelta(days=1)).strftime('%Y-%m-%d')
              
              print(f"\n📅 Looking for Back Dates: {back_dates[0]} to {back_dates[-1]}")
              
              full_channels = OrderedDict()
              full_programmes_dict = {} 
              
              live_channels = OrderedDict()
              live_programmes_dict = {} 
              
              # 1. Process back dates (9 days only)
              print("\n" + "=" * 70)
              print("📂 PROCESSING CATCHUP (9 DAYS BACK - SELECTED CHANNELS)")
              print("=" * 70)
              
              catchup_files_found = 0
              catchup_progs_added = 0
              sample_xml_channels = set()
              
              for date_str in back_dates:
                  files = sorted(glob.glob(f"Epg/{date_str}*.xml"))
                  if not files: 
                      continue
                  
                  catchup_files_found += len(files)
                  print(f"\n  📅 {date_str}: Found {len(files)} files")
                  
                  for file_path in files:
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              content = f.read()
                          
                          channels, programmes = parse_epg_content(content)
                          added_from_this_file = 0
                          
                          # Store a few XML channel IDs to help debug if matching fails
                          for cid in channels.keys():
                              if len(sample_xml_channels) < 15:
                                  sample_xml_channels.add(cid)
                          
                          for ch_id in channel_ids:
                              if ch_id in channels:
                                  if ch_id not in full_channels:
                                      full_channels[ch_id] = channels[ch_id]
                                  
                                  for prog in programmes:
                                      if prog['channel'] == ch_id:
                                          prog_key = (prog['channel'], prog['start'])
                                          full_programmes_dict[prog_key] = prog
                                          added_from_this_file += 1
                                          catchup_progs_added += 1
                          
                          print(f"    ✓ {os.path.basename(file_path)} -> Added {added_from_this_file} catchup programmes")
                      except Exception as e:
                          print(f"    ✗ Error reading {file_path}: {e}")
              
              if catchup_files_found == 0:
                  print("\n  ⚠️ WARNING: NO files found in the 'Epg' folder for the last 9 days!")
              elif catchup_progs_added == 0:
                  print("\n  ⚠️ CRITICAL WARNING: Files were found, but 0 programmes were added!")
                  print("  This means the channel names in your text file DO NOT MATCH the IDs in the XML files.")
                  print(f"  Here are some channel IDs actually found inside your XML files for comparison:\n  {list(sample_xml_channels)}")
              
              # 2. Process today
              print("\n" + "=" * 70)
              print("📂 PROCESSING TODAY (ALL CHANNELS)")
              print("=" * 70)
              
              today_files = sorted(glob.glob(f"Epg/{today_str}*.xml"))
              for file_path in today_files:
                  try:
                      with open(file_path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      
                      channels, programmes = parse_epg_content(content)
                      print(f"  📅 {today_str}: {os.path.basename(file_path)} ({len(channels)} channels, {len(programmes)} programmes)")
                      
                      for ch_id, ch_xml in channels.items():
                          if ch_id not in full_channels: full_channels[ch_id] = ch_xml
                          if ch_id not in live_channels: live_channels[ch_id] = ch_xml
                      
                      for prog in programmes:
                          prog_key = (prog['channel'], prog['start'])
                          full_programmes_dict[prog_key] = prog
                          live_programmes_dict[prog_key] = prog
                          
                  except Exception as e:
                      print(f"    ✗ Error: {e}")
              
              # 3. Process tomorrow
              print("\n" + "=" * 70)
              print("📂 PROCESSING TOMORROW (ALL CHANNELS)")
              print("=" * 70)
              
              tomorrow_files = sorted(glob.glob(f"Epg/{tomorrow_str}*.xml"))
              for file_path in tomorrow_files:
                  try:
                      with open(file_path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      
                      channels, programmes = parse_epg_content(content)
                      print(f"  📅 {tomorrow_str}: {os.path.basename(file_path)} ({len(channels)} channels, {len(programmes)} programmes)")
                      
                      for ch_id, ch_xml in channels.items():
                          if ch_id not in full_channels: full_channels[ch_id] = ch_xml
                          if ch_id not in live_channels: live_channels[ch_id] = ch_xml
                      
                      for prog in programmes:
                          prog_key = (prog['channel'], prog['start'])
                          full_programmes_dict[prog_key] = prog
                          live_programmes_dict[prog_key] = prog
                          
                  except Exception as e:
                      print(f"    ✗ Error: {e}")
              
              # Generate outputs
              print("\n" + "=" * 70)
              print("📝 GENERATING OUTPUT FILES")
              print("=" * 70)
              
              full_programmes = list(full_programmes_dict.values())
              live_programmes = list(live_programmes_dict.values())

              if full_programmes:
                  print("\n📦 Building Full EPG (back dates + today + tomorrow)...")
                  build_xml_content = build_xml(full_channels, full_programmes)
                  write_compressed_file(build_xml_content, 'Epg.xml.gz')
                  print(f"  ✓ Full EPG compressed!")
              
              if live_programmes:
                  print("\n📦 Building Live EPG (today + tomorrow only)...")
                  build_xml_content = build_xml(live_channels, live_programmes)
                  write_compressed_file(build_xml_content, 'LiveEpg.xml.gz')
                  print(f"  ✓ Live EPG compressed!")
              
              print(f"\n{'=' * 70}")
              print("✅ MERGE SUMMARY")
              print(f"{'=' * 70}")
              print(f"  Catchup Back-Date Files Found: {catchup_files_found}")
              print(f"  Catchup Programmes Added: {catchup_progs_added}")
              
              if os.path.exists('Epg.xml.gz'):
                  size = os.path.getsize('Epg.xml.gz')
                  print(f"\n  Final Epg.xml.gz: {size/1024/1024:.2f} MB")
              if os.path.exists('LiveEpg.xml.gz'):
                  size = os.path.getsize('LiveEpg.xml.gz')
                  print(f"  Final LiveEpg.xml.gz: {size/1024/1024:.2f} MB")

          if __name__ == "__main__":
              main()
          PYTHON_EOF
          
          python3 merge_epg.py

      - name: Commit and Push
        run: |
          rm -f merge_epg.py Epg.xml LiveEpg.xml
          
          if [ -f Epg.xml.gz ] && [ -f LiveEpg.xml.gz ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add Epg.xml.gz LiveEpg.xml.gz
            
            if git diff --cached --quiet; then
              echo "ℹ️ No changes to commit"
            else
              git commit -m "Auto update EPG: $(date +%Y-%m-%d_%H-%M) [skip ci]"
              git push
              echo "✓ Successfully pushed!"
            fi
          else
            echo "❌ ERROR: Output files were not created!"
            exit 1
          fi
