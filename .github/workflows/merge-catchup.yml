name: Merge Catchup Parts

on:
  push:
    paths:
      - 'Catchup.xml.part*'
  workflow_dispatch: # Allows you to trigger it manually from the UI

permissions:
  contents: write

jobs:
  merge-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Catches all parts from 001 to 011 in alphanumeric order and merges them
      - name: Concatenate Parts
        run: |
          cat Catchup.xml.part* > catchup.xml

      - name: Compress to GZIP
        run: |
          gzip -9 -c catchup.xml > catchup.xml.gz

      - name: Commit and Push Merged XML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catchup.xml.gz
          git commit -m "auto update epg [skip ci]" || echo "No changes to commit"
          git push
